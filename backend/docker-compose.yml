services:
  postgres:
    image: postgres:17-alpine
    container_name: portfoliohub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfoliohub
      POSTGRES_USER: portfoliohub
      POSTGRES_PASSWORD: 0000
    ports:
      - "5433:5432"
    volumes:
      - portfoliohub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfoliohub -d portfoliohub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: portfoliohub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - portfoliohub_redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  portfoliohub_pgdata:
  portfoliohub_redisdata:
