spring:
  application:
    name: portfoliohub-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  api:
    version: v1
  email:
    from-address: ${EMAIL_FROM_ADDRESS:no-reply@example.com}
    from-name: ${EMAIL_FROM_NAME:PortfolioHub}
    verification:
      expiry-minutes: ${EMAIL_OTP_EXPIRY_MINUTES:10}
      resend-cooldown-seconds: ${EMAIL_OTP_RESEND_COOLDOWN_SECONDS:60}
      max-attempts: ${EMAIL_OTP_MAX_ATTEMPTS:5}
      otp-secret: ${OTP_HASH_SECRET:${JWT_SECRET:change-this-local-only-secret-at-least-32-bytes}}
  security:
    jwt:
      issuer: ${JWT_ISSUER:portfoliohub}
      secret: ${JWT_SECRET:change-this-local-only-secret-at-least-32-bytes}
      access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
      refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
