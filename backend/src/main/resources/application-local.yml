spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfoliohub}
    username: ${DB_USERNAME:portfoliohub}
    password: ${DB_PASSWORD:portfoliohub}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
